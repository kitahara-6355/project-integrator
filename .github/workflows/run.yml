name: Run Integrated Projects

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-projects:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. 依存パッケージをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f services/project_a/requirements.txt ]; then pip install -r services/project_a/requirements.txt; fi
          if [ -f services/project_b/requirements.txt ]; then pip install -r services/project_b/requirements.txt; fi

      # 4. 統合スクリプトを実行
      - name: Run all projects
        run: |
          python run_all.py

      # 5. ダッシュボードをアーティファクトとして保存
      - name: Upload Dashboard
        uses: actions/upload-artifact@v3
        with:
          name: dashboard
          path: dashboard/index.html
