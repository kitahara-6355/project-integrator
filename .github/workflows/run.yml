name: Run Integrated Projects

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-projects:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. 共通の依存パッケージをインストール
      - name: Install common dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. サービスごとの依存ライブラリをインストール
      - name: Install service-specific dependencies
        run: |
          for service_dir in services/*; do
            if [ -d "$service_dir" ] && [ -f "$service_dir/requirements.txt" ]; then
              echo "Installing dependencies for $service_dir"
              pip install -r "$service_dir/requirements.txt"
            fi
          done

      # 5. 統合スクリプトを実行
      - name: Run all projects
        run: python run_all.py

      # 6. ダッシュボードをアーティファクトとして保存
      - name: Upload Dashboard
        uses: actions/upload-artifact@v3
        with:
          name: dashboard
          path: dashboard/index.html
